[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobly-linkedin-mcp-server"
version = "1.0.0"
description = "A Model Context Protocol server for LinkedIn job scraping and resume matching"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Sujith Julakanti", email = "sujith@example.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.9"
dependencies = [
    "linkedin-api>=2.0.0",
    "fastmcp>=0.1.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.2",
    "selenium>=4.15.0",
    "pydantic>=2.5.3",
    "uvicorn>=0.24.0",
    "PyPDF2>=3.0.0",
    "nltk>=3.8",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "flake8>=6.0.0"
]

[project.urls]
Homepage = "https://github.com/yourusername/jobly-linkedin-mcp-server"
Repository = "https://github.com/yourusername/jobly-linkedin-mcp-server"
Issues = "https://github.com/yourusername/jobly-linkedin-mcp-server/issues"

[project.scripts]
mcp-linkedin = "src.server.linkedin_mcp_client:main"

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "README.md",
    "LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
